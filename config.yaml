name: "Ollama"
version: "1.0.1"
slug: "ollama"
description: "Ollama LLM Server as Home Assistant Add-on"
url: "https://github.com/wolli112-vc/ollama-ha-app"
arch:
  - aarch64
  - amd64
  - armv7
init: false
map:
  - addon_config:rw
ports:
  11434/tcp: 11434
ports_description:
  11434/tcp: "Ollama API Port"
options:
  models_dir: "/config/models"
  env_vars: []
schema:
  models_dir: str
  env_vars:
    - name: str
      value: str
